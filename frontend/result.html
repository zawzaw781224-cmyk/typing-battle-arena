<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game Result</title>
    <link
    rel="stylesheet"
    href="css/result.css"
>

</head>

<body>

    <main>

        <h1 id="resultTitle">
            GAME RESULT
        </h1>

        <h2 id="resultMessage">
            Loading...
        </h2>

        <p>
            Game Type:
            <span id="gameType"></span>
        </p>

        <p>
            Room:
            <span id="roomCode"></span>
        </p>

        <p>
            Your Progress:
            <span id="yourProgress"></span>
        </p>

        <p>
            Opponent Progress:
            <span id="opponentProgress"></span>
        </p>

        <p id="yourHpRow">
            Your HP:
            <span id="yourHp"></span>
        </p>

        <p id="opponentHpRow">
            Opponent HP:
            <span id="opponentHp"></span>
        </p>

        <button
            id="dashboardBtn"
            type="button"
        >
            BACK TO DASHBOARD
        </button>

    </main>

    <script src="js/result.js"></script>
    
</body>

</html>
